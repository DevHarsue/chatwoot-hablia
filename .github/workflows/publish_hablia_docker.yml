name: Publish Hablia Docker image

# Manual trigger only. Runs entirely on GitHub-hosted runners — does not
# load the developer's laptop. Replicates scripts/deploy.sh but in CI.

on:
  workflow_dispatch:

env:
  DOCKER_REPO: devharsue/chatwoot-hablia

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:testing
            ${{ env.DOCKER_REPO }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo ""
            echo "- \`${DOCKER_REPO}:testing\`"
            echo "- \`${DOCKER_REPO}:${{ steps.vars.outputs.short_sha }}\`"
            echo ""
            echo "Pull with:"
            echo ""
            echo '```bash'
            echo "docker pull ${DOCKER_REPO}:testing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
