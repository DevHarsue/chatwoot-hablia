schema_version: 1
resource:
  type: "hook"
  name: "pre-review-gate"
source: "scripts/ai/pre_review_gate.py"
client: "claude"
outputs:
  - ".claude/hooks/pre_review_gate.py"
transformations:
  - "Keeps the Claude entrypoint as a wrapper around the portable gate."
capability_mapping:
  lifecycle:
    event: "PreToolUse"
    matcher: "Bash"
  pre_review_marker:
    path: ".agents/.pre-review-passed"
    write_method: "Write"
validation:
  commands:
    - "python3 scripts/ai/test_pre_review_gate.py"
drift:
  strategy: "sha256"
  source_sha256: "44b25d0d56b04de64690db7a8120108b336b4836c8fffef4e72435a9a3fc374d"
