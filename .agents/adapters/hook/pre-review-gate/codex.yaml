schema_version: 1
resource:
  type: "hook"
  name: "pre-review-gate"
source: "scripts/ai/pre_review_gate.py"
client: "codex"
outputs:
  - ".codex/config.toml"
transformations:
  - "Registers PreToolUse for shell commands through the portable gate core."
capability_mapping:
  lifecycle:
    event: "PreToolUse"
    matcher: "Bash"
  pre_review_marker:
    path: ".agents/.pre-review-passed"
    write_method: "apply_patch"
validation:
  commands:
    - "python3 scripts/ai/test_pre_review_gate.py"
drift:
  strategy: "sha256"
  source_sha256: "7d9bcae4b43da08b244e0984738d3e7b896419309f509cf74dc52b8fd617a441"
  output_sha256: "3e7f613fd7a29f02170bd598e06caa9231068ae06f33f853afe898832ac3356f"
owner: "Harwing Martinez y Francisco Maldonado"
exception_ids: []
