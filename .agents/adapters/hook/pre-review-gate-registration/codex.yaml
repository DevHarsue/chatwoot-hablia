schema_version: 1
resource:
  type: "hook"
  name: "pre-review-gate-registration"
source: ".agents/hooks/pre-review-gate.md"
client: "codex"
outputs:
  - ".codex/config.toml"
transformations:
  - "Registers PreToolUse for shell commands through the portable gate core."
capability_mapping:
  lifecycle:
    event: "PreToolUse"
    matcher: "Bash"
  pre_review_marker:
    path: ".agents/.pre-review-passed"
    write_method: "apply_patch"
validation:
  commands:
    - "python3 scripts/ai/test_pre_review_gate.py"
drift:
  strategy: "sha256"
  source_sha256: "a7302b8ebc6624eeab61c4c58a6e93f3a6ed2d638b6b68629046d481fed29ed9"
  output_sha256: "3e7f613fd7a29f02170bd598e06caa9231068ae06f33f853afe898832ac3356f"
owner: "Harwing Martinez y Francisco Maldonado"
exception_ids: []
