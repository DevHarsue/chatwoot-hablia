schema_version: 1
resource:
  type: "hook"
  name: "pre-review-gate-registration"
source: ".agents/hooks/pre-review-gate.md"
client: "claude"
outputs:
  - ".claude/settings.json"
transformations:
  - "Registers PreToolUse for shell commands through the Claude compatibility wrapper."
capability_mapping:
  lifecycle:
    event: "PreToolUse"
    matcher: "Bash"
  pre_review_marker:
    path: ".agents/.pre-review-passed"
    write_method: "Write"
validation:
  commands:
    - "python3 scripts/ai/test_pre_review_gate.py"
drift:
  strategy: "sha256"
  source_sha256: "1cab3dc27ff41f87f42cc5384c372f6ba0a00aaa9b8b2c2811869b28f5d1f48a"
  output_sha256: "ffb13e0865f7136a880f419f49ae6d5b8300703c393e2cc1b693ee55fe5804ef"
owner: "Harwing Martinez y Francisco Maldonado"
exception_ids: []
