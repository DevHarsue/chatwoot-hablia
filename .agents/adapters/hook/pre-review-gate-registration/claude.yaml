schema_version: 1
resource:
  type: "hook"
  name: "pre-review-gate-registration"
source: ".agents/hooks/pre-review-gate.md"
client: "claude"
outputs:
  - ".claude/settings.json"
transformations:
  - "Registers PreToolUse for shell commands through the Claude compatibility wrapper."
capability_mapping:
  lifecycle:
    event: "PreToolUse"
    matcher: "Bash"
  pre_review_marker:
    path: ".agents/.pre-review-passed"
    write_method: "Write"
validation:
  commands:
    - "python3 scripts/ai/test_pre_review_gate.py"
drift:
  strategy: "sha256"
  source_sha256: "a7302b8ebc6624eeab61c4c58a6e93f3a6ed2d638b6b68629046d481fed29ed9"
  output_sha256: "d52f1b73ef5118112ae5e019d3bd72b10cd85d9364006dafc6e46e1dc0b48f44"
owner: "Harwing Martinez y Francisco Maldonado"
exception_ids: []
